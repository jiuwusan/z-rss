<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Z-RSS 订阅平台管理、缓存刷新与聚合条目浏览台"
    />
    <title>Z-RSS 管理台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="app-header">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">ZR</div>
          <div>
            <p class="eyebrow">RSS OPERATIONS</p>
            <h1>Z-RSS 管理台</h1>
            <p class="header-description">管理订阅源，刷新缓存，聚合每一条更新。</p>
          </div>
        </div>
        <div class="header-actions">
          <span class="service-state" id="service-status">
            <span class="status-dot" aria-hidden="true"></span>
            <span>正在连接</span>
          </span>
          <button class="button button-primary" id="refresh-button" type="button">
            <span class="button-icon" aria-hidden="true">↻</span>
            刷新全部缓存
          </button>
        </div>
      </header>

      <main>
        <section class="stats-grid" aria-label="缓存概览">
          <article class="stat-card">
            <span class="stat-label">订阅平台</span>
            <strong class="stat-value" id="platform-count">—</strong>
            <span class="stat-note">当前已配置</span>
          </article>
          <article class="stat-card stat-card-accent">
            <span class="stat-label">缓存条目</span>
            <strong class="stat-value" id="item-count">—</strong>
            <span class="stat-note">来自本地缓存</span>
          </article>
          <article class="stat-card">
            <span class="stat-label">最近刷新</span>
            <strong class="stat-value stat-value-time" id="last-refresh">尚未刷新</strong>
            <span class="stat-note">本次页面会话</span>
          </article>
        </section>

        <section class="workspace-grid">
          <aside class="panel platforms-panel" id="platforms-panel">
            <div class="panel-heading">
              <div>
                <p class="section-kicker">SUBSCRIPTIONS</p>
                <h2>订阅平台</h2>
              </div>
              <button class="button button-secondary button-compact" id="add-platform-button" type="button">
                <span aria-hidden="true">＋</span>
                新增
              </button>
            </div>
            <p class="panel-description">平台名是唯一标识，修改时仅更新 RSS 地址。</p>
            <div class="platform-list" id="platform-list" aria-live="polite">
              <div class="loading-block">正在加载订阅平台…</div>
            </div>
          </aside>

          <section class="panel items-panel" aria-labelledby="items-heading">
            <div class="panel-heading items-heading-row">
              <div>
                <p class="section-kicker">LATEST CACHE</p>
                <h2 id="items-heading">聚合条目</h2>
              </div>
              <span class="cache-badge">只读本地缓存</span>
            </div>
            <div class="refresh-results" id="refresh-results" hidden aria-live="polite"></div>
            <div class="items-list" id="items-list" aria-live="polite" aria-busy="true">
              <div class="loading-block loading-block-large">正在读取缓存条目…</div>
            </div>
          </section>
        </section>
      </main>
    </div>

    <dialog class="modal" id="platform-dialog" aria-labelledby="platform-dialog-title">
      <form class="modal-card" id="platform-form">
        <div class="modal-heading">
          <div>
            <p class="section-kicker">SUBSCRIPTION</p>
            <h2 id="platform-dialog-title">新增订阅平台</h2>
          </div>
          <button class="icon-button" data-close-dialog="platform-dialog" type="button" aria-label="关闭">×</button>
        </div>
        <label class="field">
          <span>平台名称</span>
          <input id="platform-input" name="platform" autocomplete="off" maxlength="64" required />
          <small>创建后作为唯一标识，修改 RSS 时不可更名。</small>
        </label>
        <label class="field">
          <span>RSS 地址</span>
          <input id="rss-input" name="rss" type="url" placeholder="https://example.com/rss.xml" required />
        </label>
        <p class="form-error" id="platform-form-error" hidden></p>
        <div class="modal-actions">
          <button class="button button-ghost" data-close-dialog="platform-dialog" type="button">取消</button>
          <button class="button button-primary" id="platform-submit-button" type="submit">保存平台</button>
        </div>
      </form>
    </dialog>

    <dialog class="modal modal-wide" id="xml-dialog" aria-labelledby="xml-dialog-title">
      <div class="modal-card">
        <div class="modal-heading">
          <div>
            <p class="section-kicker">RAW ITEM</p>
            <h2 id="xml-dialog-title">原始 XML</h2>
          </div>
          <button class="icon-button" data-close-dialog="xml-dialog" type="button" aria-label="关闭">×</button>
        </div>
        <pre class="xml-viewer" id="xml-content" tabindex="0"></pre>
        <div class="modal-actions">
          <button class="button button-ghost" data-close-dialog="xml-dialog" type="button">关闭</button>
          <button class="button button-secondary" id="copy-xml-button" type="button">复制 XML</button>
        </div>
      </div>
    </dialog>

    <div class="toast-region" id="toast-region" aria-live="assertive" aria-atomic="true"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
